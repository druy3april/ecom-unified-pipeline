name: 'dbt_ecom'
version: '1.0.0'
config-version: 2

# Profile chỉ định cấu hình database trong profiles.yml
profile: 'ecom_dbt_profile'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_ecom:
    # Staging: materialized dạng view để tiết kiệm dung lượng lưu trữ
    staging:
      +materialized: view
      +schema: staging
    # Intermediate: materialized dạng view hoặc ephemeral
    intermediate:
      +materialized: view
      +schema: intermediate
    # Marts: materialized dạng table để tối ưu tốc độ query cho Power BI
    marts:
      +materialized: table
      +schema: marts