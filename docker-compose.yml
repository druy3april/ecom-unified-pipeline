services:
  # ==========================================
  # 1. DATA WAREHOUSE: PostgreSQL
  # ==========================================
  postgres-dw:
    image: postgres:15-alpine
    container_name: ecom_postgres_dw
    environment:
      POSTGRES_DB: ecom_dw
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: REDACTED_POSTGRES_PASSWORD
    ports:
      - "5432:5432"
    volumes:
      - postgres_dw_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecom_dw"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecom_network

  # ==========================================
  # 2. DATA LAKE: MinIO (quay.io mirror chính thức)
  # ==========================================
  minio:
    image: quay.io/minio/minio:latest
    container_name: ecom_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: REDACTED_MINIO_PASSWORD
    ports:
      - "9000:9000"   # API S3 Endpoint
      - "9001:9001"   # Web Console UI
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - ecom_network

volumes:
  postgres_dw_data:
  minio_data:

networks:
  ecom_network:
    driver: bridge