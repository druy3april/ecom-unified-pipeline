services:
  # ==========================================
  # 1. DATA WAREHOUSE: PostgreSQL
  # ==========================================
  postgres-dw:
    image: postgres:15-alpine
    container_name: ecom_postgres_dw
    environment:
      POSTGRES_DB: ecom_dw
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dw_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ecom_dw"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecom_network

  # ==========================================
  # 2. DATA LAKE: MinIO (quay.io mirror chính thức)
  # ==========================================
  minio:
    image: quay.io/minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: ecom_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"   # API S3 Endpoint
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"   # Web Console UI
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - ecom_network

volumes:
  postgres_dw_data:
  minio_data:

networks:
  ecom_network:
    driver: bridge